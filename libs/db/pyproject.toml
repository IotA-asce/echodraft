[project]
name = "echodraft-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "echodraft-domain-models",
  "sqlalchemy>=2.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echodraft_db"]
