components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
    VoiceId:
      name: voiceId
      in: path
      required: true
      schema:
        type: string
    PronunciationEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
  schemas:
    TtsSettings:
      type: object
      properties:
        provider:
          type: string
          enum: [mock, kokoro, piper, xtts_v2]
        setupMode:
          type:
            - string
            - "null"
          enum: [managed_onnx, custom_adapter, local_cli, coqui_local, null]
        executable:
          type:
            - string
            - "null"
        runtimeRoot:
          type:
            - string
            - "null"
        pythonPath:
          type:
            - string
            - "null"
        modelPath:
          type:
            - string
            - "null"
        voicesDataPath:
          type:
            - string
            - "null"
        voiceRegistryPath:
          type:
            - string
            - "null"
        piperModelPath:
          type:
            - string
            - "null"
        piperConfigPath:
          type:
            - string
            - "null"
        referenceVoicePath:
          type:
            - string
            - "null"
        referenceVoiceConsent:
          type: boolean
        language:
          type: string
        ready:
          type: boolean
        message:
          type:
            - string
            - "null"
        availableVoices:
          type: array
          items:
            type: string
    TtsSettingsUpdate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [mock, kokoro, piper, xtts_v2]
        setupMode:
          type:
            - string
            - "null"
          enum: [managed_onnx, custom_adapter, local_cli, coqui_local, null]
        executable:
          type:
            - string
            - "null"
        runtimeRoot:
          type:
            - string
            - "null"
        pythonPath:
          type:
            - string
            - "null"
        modelPath:
          type:
            - string
            - "null"
        voicesDataPath:
          type:
            - string
            - "null"
        voiceRegistryPath:
          type:
            - string
            - "null"
        piperModelPath:
          type:
            - string
            - "null"
        piperConfigPath:
          type:
            - string
            - "null"
        referenceVoicePath:
          type:
            - string
            - "null"
        referenceVoiceConsent:
          type: boolean
        language:
          type: string
    TtsProviderInfo:
      type: object
      properties:
        provider:
          type: string
          enum: [mock, kokoro, piper, xtts_v2]
        displayName:
          type: string
        setupMode:
          type:
            - string
            - "null"
        ready:
          type: boolean
        message:
          type:
            - string
            - "null"
        availableVoices:
          type: array
          items:
            type: string
        capabilities:
          type: object
          additionalProperties: true
        requiresReferenceConsent:
          type: boolean
        referenceVoiceConsent:
          type:
            - boolean
            - "null"
        referenceVoicePath:
          type:
            - string
            - "null"
    LocalAiCatalogItem:
      type: object
      properties:
        modelKey:
          type: string
        displayName:
          type: string
        capability:
          type: string
        provider:
          type: string
        installType:
          type: string
        required:
          type: boolean
        sizeMb:
          type:
            - integer
            - "null"
        licenseSummary:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        status:
          type: string
        health:
          type: string
        installPath:
          type:
            - string
            - "null"
        lastVerifiedAt:
          type:
            - string
            - "null"
          format: date-time
    LocalAiInstallation:
      type: object
      properties:
        id:
          type: string
        modelKey:
          type: string
        displayName:
          type: string
        capability:
          type: string
        provider:
          type: string
        version:
          type:
            - string
            - "null"
        installPath:
          type:
            - string
            - "null"
        status:
          type: string
        installedAt:
          type:
            - string
            - "null"
          format: date-time
        lastVerifiedAt:
          type:
            - string
            - "null"
          format: date-time
        sizeBytes:
          type:
            - integer
            - "null"
        errorMessage:
          type:
            - string
            - "null"
    LocalAiInstallRequest:
      type: object
      properties:
        confirmNetworkDownload:
          type: boolean
        confirmThirdPartyLicense:
          type: boolean
        confirmSystemInstall:
          type: boolean
        repair:
          type: boolean
    LocalAiHealth:
      type: object
      properties:
        modelKey:
          type: string
        status:
          type: string
        ready:
          type: boolean
        message:
          type: string
        version:
          type:
            - string
            - "null"
        installPath:
          type:
            - string
            - "null"
        checkedAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    LocalAiInstallJob:
      type: object
      properties:
        id:
          type: string
        jobId:
          type: string
        modelKey:
