openapi: 3.1.0
info:
  title: AI Audiobook Studio API
  version: 0.1.0
  description: >
    Local-first MVP API for project creation, manuscript import, structure
    management, voice assignment, segment rendering, chapter assembly, review,
    rights gating, and export.
servers:
  - url: http://localhost:8000
tags:
  - name: Projects
  - name: Source
  - name: Structure
  - name: Casting
  - name: Pronunciation
  - name: Rendering
  - name: Sound Design
  - name: Local AI
  - name: Settings
  - name: Jobs
  - name: Review
  - name: Exports
  - name: Rights
paths:
  /api/v1/settings/tts:
    get:
      tags: [Settings]
      summary: Get active local TTS settings and readiness
      responses:
        "200":
          description: Active TTS settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsSettings"
    put:
      tags: [Settings]
      summary: Save local TTS settings after validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsSettingsUpdate"
      responses:
        "200":
          description: TTS settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsSettings"

  /api/v1/settings/tts/providers:
    get:
      tags: [Settings]
      summary: List local TTS provider readiness and capabilities
      responses:
        "200":
          description: Local provider status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TtsProviderInfo"

  /api/v1/settings/tts/kokoro/setup:
    get:
      tags: [Settings]
      summary: Report managed Kokoro ONNX setup status
      description: >
        Reports whether the local managed Kokoro runtime is not started,
        incomplete, failed, ready, or active. Managed setup is local-only and
        stores runtime files under `.echodraft/kokoro/managed-onnx-v1` by
        default.
      responses:
        "200":
          description: Managed Kokoro setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KokoroSetupStatus"

  /api/v1/settings/tts/kokoro/setup/install:
    post:
      tags: [Settings]
      summary: Start managed Kokoro ONNX setup
      description: >
        Starts a local setup job that creates the Kokoro runtime, installs
        Kokoro ONNX packages, downloads model and voice assets, builds the
        voice registry, validates a preview, and saves settings only after
        validation succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KokoroSetupInstallRequest"
      responses:
        "200":
          description: Setup job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/local-ai/catalog:
    get:
      tags: [Local AI]
      summary: List local model and tool catalog entries with health
      responses:
        "200":
          description: Local AI catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalAiCatalogItem"

  /api/v1/local-ai/installed:
    get:
      tags: [Local AI]
      summary: List persisted local model and tool installation records
      responses:
        "200":
          description: Installed local capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalAiInstallation"

  /api/v1/local-ai/models/{model_key}/install:
    post:
      tags: [Local AI]
      summary: Start a local model or system-tool install job
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalAiInstallRequest"
      responses:
        "202":
          description: Install job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/local-ai/models/{model_key}:
    delete:
      tags: [Local AI]
      summary: Remove an app-managed local model entry
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: App-managed model entry removed

  /api/v1/local-ai/models/{model_key}/verify:
    post:
      tags: [Local AI]
      summary: Verify and persist one local capability health record
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation status after verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiInstallation"

  /api/v1/local-ai/models/{model_key}/health:
    get:
      tags: [Local AI]
      summary: Check current health for one local capability
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local capability health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiHealth"

  /api/v1/local-ai/jobs/{jobId}:
    get:
      tags: [Local AI]
      summary: Get local model install job metadata
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Local AI install job metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiInstallJob"

  /api/v1/local-llm/ollama/models:
    get:
      tags: [Local LLM]
      summary: List installed Ollama models from /api/tags
      responses:
        "200":
          description: Ollama local model list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/v1/local-llm/embeddings:
    post:
      tags: [Local LLM]
      summary: Generate local embeddings through Ollama /api/embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embeddings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResult"

  /api/v1/projects/{projectId}/local-llm/extractions:
    post:
      tags: [Local LLM]
      summary: Start a schema-first local LLM extraction job
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmExtractionRequest"
      responses:
        "202":
          description: Extraction job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/llm-runs:
    get:
      tags: [Local LLM]
      summary: List local LLM runs for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: LLM run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmRun"

  /api/v1/llm-runs/{runId}:
    get:
      tags: [Local LLM]
      summary: Get one local LLM run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: LLM run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmRun"

  /api/v1/sources/{source_id}:
    get:
      tags: [Source]
      summary: Get one source document and canonical preview
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source document with canonical preview when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"

  /api/v1/sources/{source_id}/pages:
    get:
      tags: [Source]
      summary: List page-level extraction records for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source page records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourcePage"

  /api/v1/sources/{source_id}/pages/{page_number}:
    get:
      tags: [Source]
      summary: Get one page-level extraction record
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
        - name: page_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source page record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"

  /api/v1/sources/{source_id}/cleaning-issues:
    get:
      tags: [Source]
      summary: List clean-text review issues for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clean-text review issue records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TextCleanlinessIssue"

  /api/v1/sources/{source_id}/cleaning-runs:
    get:
      tags: [Source]
      summary: List clean-text runs for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clean-text run records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningRun"

  /api/v1/cleaning-issues/{issue_id}:
    patch:
      tags: [Source]
      summary: Update clean-text review issue state
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextCleanlinessIssueUpdate"
      responses:
        "200":
          description: Updated clean-text review issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextCleanlinessIssue"

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      tags: [Projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted

  /api/v1/projects/{projectId}/source/import:
    post:
      tags: [Source]
      summary: Import manuscript source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/source/reparse:
    post:
      tags: [Source]
      summary: Re-run parsing on source document
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReparseRequest"
      responses:
        "202":
          description: Reparse job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/source:
    get:
      tags: [Source]
      summary: Get the latest imported source document and canonical preview
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Latest source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"

  /api/v1/projects/{projectId}/chapters:
    get:
      tags: [Structure]
      summary: List chapters for project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Chapter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /api/v1/projects/{projectId}/structure-warnings:
    get:
      tags: [Structure]
      summary: List parser warnings for the current structure
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Structure parser warning list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StructureParserWarning"

  /api/v1/projects/{projectId}/structure/quality:
    get:
      tags: [Structure]
      summary: Get structure quality metrics for the current draft
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Structure quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureQuality"

  /api/v1/chapters/{chapterId}:
    get:
      tags: [Structure]
      summary: Get chapter detail
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
    patch:
      tags: [Structure]
      summary: Update chapter metadata
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterUpdate"
      responses:
        "200":
          description: Chapter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"

  /api/v1/chapters/{chapterId}/scenes:
    get:
      tags: [Structure]
      summary: List scenes for chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Scene list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"

  /api/v1/scenes/{sceneId}:
    patch:
      tags: [Structure]
      summary: Update scene metadata
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneUpdate"
      responses:
        "200":
          description: Scene updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"

  /api/v1/scenes/{sceneId}/segments:
    get:
      tags: [Structure]
      summary: List segments for scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Segment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Segment"

  /api/v1/segments/{segmentId}:
    patch:
      tags: [Structure]
      summary: Update segment text, speaker, or direction
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSegmentRequest"
      responses:
        "200":
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"

  /api/v1/structure-locks/{scopeType}/{scopeId}:
    put:
      tags: [Structure]
      summary: Lock or unlock a chapter, scene, or segment
      parameters:
        - name: scopeType
          in: path
          required: true
          schema:
            type: string
            enum: [chapter, scene, segment]
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureLockUpdate"
      responses:
        "200":
          description: Locked structure item
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Chapter"
                  - $ref: "#/components/schemas/Scene"
                  - $ref: "#/components/schemas/Segment"

  /api/v1/segments/{segmentId}/split:
    post:
      tags: [Structure]
      summary: Split a segment at a character offset
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentSplitRequest"
      responses:
        "200":
          description: Segment split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"

  /api/v1/segments/{segmentId}/merge:
    post:
      tags: [Structure]
      summary: Merge a segment with the next adjacent segment
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentMergeRequest"
      responses:
        "200":
          description: Segment merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"

  /api/v1/projects/{projectId}/segment-directions:
    get:
      tags: [Direction]
      summary: List segment directions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Segment direction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegmentDirection"

  /api/v1/projects/{projectId}/segments/{segmentId}/direction:
    get:
      tags: [Direction]
      summary: Get segment direction
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SegmentId"
      responses:
        "200":
          description: Segment direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentDirection"
    put:
      tags: [Direction]
      summary: Save segment direction
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSegmentDirectionRequest"
      responses:
        "200":
          description: Segment direction saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentDirection"

  /api/v1/projects/{projectId}/directions/infer:
    post:
      tags: [Direction]
      summary: Infer local deterministic segment directions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Direction inference job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /api/v1/projects/{projectId}/characters:
    get:
      tags: [Casting]
      summary: List characters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      tags: [Casting]
      summary: Create character
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/characters/{characterId}:
    patch:
      tags: [Casting]
      summary: Update character
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/characters/{characterId}/merge:
    post:
      tags: [Casting]
      summary: Merge another character into this target character
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCharacterRequest"
      responses:
        "200":
          description: Target character after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/characters/{characterId}/split:
    post:
      tags: [Casting]
      summary: Split a new character record out of an existing character
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitCharacterRequest"
      responses:
        "201":
          description: Newly split character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/projects/{projectId}/speaker-attributions:
    get:
      tags: [Casting]
      summary: List speaker attributions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Speaker attribution list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeakerAttribution"

  /api/v1/projects/{projectId}/speaker-attributions/run:
    post:
      tags: [Casting]
      summary: Run deterministic speaker attribution, optionally with local Ollama fallback
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSpeakerAttributionRequest"
      responses:
        "202":
          description: Speaker attribution job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /api/v1/speaker-attributions/{speakerAttributionId}:
    patch:
      tags: [Casting]
      summary: Update speaker attribution review decision
      parameters:
        - name: speakerAttributionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpeakerAttributionRequest"
      responses:
        "200":
          description: Speaker attribution updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerAttribution"

  /api/v1/projects/{projectId}/voices:
    get:
      tags: [Casting]
      summary: List voice profiles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Voice profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceProfile"
    post:
      tags: [Casting]
      summary: Create voice profile
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
