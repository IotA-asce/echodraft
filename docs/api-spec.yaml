openapi: 3.1.0
info:
  title: AI Audiobook Studio API
  version: 0.1.0
  description: >
    Local-first MVP API for project creation, manuscript import, structure
    management, voice assignment, segment rendering, chapter assembly, review,
    rights gating, and export.
servers:
  - url: http://localhost:8000
tags:
  - name: Projects
  - name: Source
  - name: Structure
  - name: Casting
  - name: Pronunciation
  - name: Rendering
  - name: Local AI
  - name: Settings
  - name: Jobs
  - name: Review
  - name: Exports
  - name: Rights
paths:
  /api/v1/settings/tts:
    get:
      tags: [Settings]
      summary: Get active local TTS settings and readiness
      responses:
        "200":
          description: Active TTS settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsSettings"
    put:
      tags: [Settings]
      summary: Save local TTS settings after validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsSettingsUpdate"
      responses:
        "200":
          description: TTS settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsSettings"

  /api/v1/settings/tts/kokoro/setup:
    get:
      tags: [Settings]
      summary: Report managed Kokoro ONNX setup status
      description: >
        Reports whether the local managed Kokoro runtime is not started,
        incomplete, failed, ready, or active. Managed setup is local-only and
        stores runtime files under `.echodraft/kokoro/managed-onnx-v1` by
        default.
      responses:
        "200":
          description: Managed Kokoro setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KokoroSetupStatus"

  /api/v1/settings/tts/kokoro/setup/install:
    post:
      tags: [Settings]
      summary: Start managed Kokoro ONNX setup
      description: >
        Starts a local setup job that creates the Kokoro runtime, installs
        Kokoro ONNX packages, downloads model and voice assets, builds the
        voice registry, validates a preview, and saves settings only after
        validation succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KokoroSetupInstallRequest"
      responses:
        "200":
          description: Setup job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/local-ai/catalog:
    get:
      tags: [Local AI]
      summary: List local model and tool catalog entries with health
      responses:
        "200":
          description: Local AI catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalAiCatalogItem"

  /api/v1/local-ai/installed:
    get:
      tags: [Local AI]
      summary: List persisted local model and tool installation records
      responses:
        "200":
          description: Installed local capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalAiInstallation"

  /api/v1/local-ai/models/{model_key}/install:
    post:
      tags: [Local AI]
      summary: Start a local model or system-tool install job
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalAiInstallRequest"
      responses:
        "202":
          description: Install job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/local-ai/models/{model_key}:
    delete:
      tags: [Local AI]
      summary: Remove an app-managed local model entry
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: App-managed model entry removed

  /api/v1/local-ai/models/{model_key}/verify:
    post:
      tags: [Local AI]
      summary: Verify and persist one local capability health record
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation status after verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiInstallation"

  /api/v1/local-ai/models/{model_key}/health:
    get:
      tags: [Local AI]
      summary: Check current health for one local capability
      parameters:
        - name: model_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local capability health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiHealth"

  /api/v1/local-ai/jobs/{jobId}:
    get:
      tags: [Local AI]
      summary: Get local model install job metadata
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Local AI install job metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAiInstallJob"

  /api/v1/sources/{source_id}:
    get:
      tags: [Source]
      summary: Get one source document and canonical preview
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source document with canonical preview when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"

  /api/v1/sources/{source_id}/pages:
    get:
      tags: [Source]
      summary: List page-level extraction records for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source page records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourcePage"

  /api/v1/sources/{source_id}/pages/{page_number}:
    get:
      tags: [Source]
      summary: Get one page-level extraction record
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
        - name: page_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source page record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"

  /api/v1/sources/{source_id}/cleaning-issues:
    get:
      tags: [Source]
      summary: List clean-text review issues for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clean-text review issue records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TextCleanlinessIssue"

  /api/v1/sources/{source_id}/cleaning-runs:
    get:
      tags: [Source]
      summary: List clean-text runs for a source document
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clean-text run records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningRun"

  /api/v1/cleaning-issues/{issue_id}:
    patch:
      tags: [Source]
      summary: Update clean-text review issue state
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextCleanlinessIssueUpdate"
      responses:
        "200":
          description: Updated clean-text review issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextCleanlinessIssue"

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      tags: [Projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted

  /api/v1/projects/{projectId}/source/import:
    post:
      tags: [Source]
      summary: Import manuscript source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/source/reparse:
    post:
      tags: [Source]
      summary: Re-run parsing on source document
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReparseRequest"
      responses:
        "202":
          description: Reparse job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/source:
    get:
      tags: [Source]
      summary: Get the latest imported source document and canonical preview
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Latest source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"

  /api/v1/projects/{projectId}/chapters:
    get:
      tags: [Structure]
      summary: List chapters for project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Chapter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /api/v1/chapters/{chapterId}:
    get:
      tags: [Structure]
      summary: Get chapter detail
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"

  /api/v1/chapters/{chapterId}/scenes:
    get:
      tags: [Structure]
      summary: List scenes for chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Scene list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"

  /api/v1/scenes/{sceneId}/segments:
    get:
      tags: [Structure]
      summary: List segments for scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Segment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Segment"

  /api/v1/segments/{segmentId}:
    patch:
      tags: [Structure]
      summary: Update segment text, speaker, or direction
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSegmentRequest"
      responses:
        "200":
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"

  /api/v1/projects/{projectId}/characters:
    get:
      tags: [Casting]
      summary: List characters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      tags: [Casting]
      summary: Create character
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/characters/{characterId}:
    patch:
      tags: [Casting]
      summary: Update character
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /api/v1/projects/{projectId}/voices:
    get:
      tags: [Casting]
      summary: List voice profiles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Voice profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceProfile"
    post:
      tags: [Casting]
      summary: Create voice profile
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceProfileRequest"
      responses:
        "201":
          description: Voice profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceProfile"

  /api/v1/voices/{voiceId}:
    patch:
      tags: [Casting]
      summary: Update voice profile
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVoiceProfileRequest"
      responses:
        "200":
          description: Voice profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceProfile"

  /api/v1/voices/{voiceId}/preview:
    post:
      tags: [Casting]
      summary: Generate a voice preview clip
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoicePreviewRequest"
      responses:
        "202":
          description: Preview job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/characters/{characterId}/assign-voice:
    post:
      tags: [Casting]
      summary: Assign voice to character
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignVoiceRequest"
      responses:
        "200":
          description: Voice assigned

  /api/v1/projects/{projectId}/pronunciations:
    get:
      tags: [Pronunciation]
      summary: List pronunciation entries
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Pronunciation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PronunciationEntry"
    post:
      tags: [Pronunciation]
      summary: Create pronunciation entry
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePronunciationEntryRequest"
      responses:
        "201":
          description: Pronunciation entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationEntry"

  /api/v1/pronunciations/{entryId}:
    patch:
      tags: [Pronunciation]
      summary: Update pronunciation entry
      parameters:
        - $ref: "#/components/parameters/PronunciationEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePronunciationEntryRequest"
      responses:
        "200":
          description: Pronunciation entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationEntry"
    delete:
      tags: [Pronunciation]
      summary: Delete pronunciation entry
      parameters:
        - $ref: "#/components/parameters/PronunciationEntryId"
      responses:
        "204":
          description: Pronunciation entry deleted

  /api/v1/projects/{projectId}/generate/chapters:
    post:
      tags: [Rendering]
      summary: Generate all or selected chapters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateChaptersRequest"
      responses:
        "202":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/chapters/{chapterId}/generate:
    post:
      tags: [Rendering]
      summary: Generate a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateChapterRequest"
      responses:
        "202":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/segments/{segmentId}/generate:
    post:
      tags: [Rendering]
      summary: Generate or regenerate one segment
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSegmentRequest"
      responses:
        "202":
          description: Segment generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/projects/{projectId}/chapters/{chapterId}/assemble:
    post:
      tags: [Rendering]
      summary: Assemble the current successful segment renders into an immutable chapter stem
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "202":
          description: Chapter stem assembled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterRender"
        "422":
          description: A non-empty segment has no successful render or an artifact is missing

  /api/v1/projects/{projectId}/chapters/{chapterId}/renders:
    get:
      tags: [Rendering]
      summary: List immutable chapter render history, newest first
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter render history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChapterRender"

  /api/v1/projects/{projectId}/chapters/{chapterId}/active-render:
    get:
      tags: [Rendering]
      summary: Get the latest successful immutable chapter render
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Active chapter render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterRender"
        "404":
          description: Chapter not found or no assembled render exists

  /api/v1/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Get job status
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancellation result

  /api/v1/projects/{projectId}/issues:
    get:
      tags: [Review]
      summary: List project issues
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Issue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      tags: [Review]
      summary: Create an editorial issue
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreate"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /api/v1/issues/{issueId}:
    patch:
      tags: [Review]
      summary: Update issue state
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /api/v1/segments/{segmentId}/comments:
    post:
      tags: [Review]
      summary: Add comment on segment
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/issues/{issueId}/comments:
    get:
      tags: [Review]
      summary: List issue comments
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Comment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      tags: [Review]
      summary: Add a comment to an issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/projects/{projectId}/segments/{segmentId}/patch:
    post:
      tags: [Review]
      summary: Patch one segment and reassemble only its owning chapter
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentPatchRequest"
      responses:
        "202":
          description: Patch completed with immutable render lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPatchResult"

  /api/v1/segments/{segmentId}/mark-reviewed:
    post:
      tags: [Review]
      summary: Mark segment as reviewed
      parameters:
        - $ref: "#/components/parameters/SegmentId"
      responses:
        "200":
          description: Segment marked reviewed

  /api/v1/projects/{projectId}/exports:
    get:
      tags: [Exports]
      summary: List exports
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Export list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportPackage"
    post:
      tags: [Exports]
      summary: Create export
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportRequest"
      responses:
        "202":
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"

  /api/v1/exports/{exportId}:
    get:
      tags: [Exports]
      summary: Get export detail
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackage"

  /api/v1/projects/{projectId}/rights:
    get:
      tags: [Rights]
      summary: Get rights declarations
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Rights detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightsDeclaration"

  /api/v1/projects/{projectId}/rights/declaration:
    post:
      tags: [Rights]
      summary: Create or update rights declaration
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRightsDeclarationRequest"
      responses:
        "200":
          description: Rights declaration stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightsDeclaration"

