[project]
name = "echodraft-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "echodraft-db",
  "echodraft-domain-models",
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
echodraft-api = "echodraft_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echodraft_api"]
