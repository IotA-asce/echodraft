name: Bug report
description: Report a problem with Echodraft
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much of this form as you can.

        **Do not attach copyrighted manuscripts or book excerpts to this issue.** If the bug is manuscript-specific, describe its structure below (length, format, language) instead of uploading the file, or reduce the repro to a public-domain excerpt.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Create a project with '...'
        2. Import a manuscript of type '...'
        3. Run '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Debian/Ubuntu)
        - Linux (Fedora)
        - Linux (other)
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "e.g. 20.14.0"
    validations:
      required: true
  - type: dropdown
    id: tts-provider
    attributes:
      label: TTS provider in use
      options:
        - Mock (deterministic silent WAV)
        - Kokoro (local ONNX)
        - Piper
        - XTTS-v2 (local)
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: manuscript
    attributes:
      label: Manuscript characteristics
      description: >
        Describe the manuscript's length, format, and language if relevant to the bug.
        Do NOT attach the manuscript file itself, especially if it is copyrighted.
      placeholder: "e.g. ~450 pages, EPUB, English, contains footnotes and front-matter"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant API or browser console logs. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help diagnose the issue.
    validations:
      required: false
