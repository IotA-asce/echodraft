name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy apps/api/src libs/domain-models/src libs/db/src

  migrations:
    name: Migrations (round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages
      - name: Upgrade, downgrade, upgrade
        env:
          ECHODRAFT_DATABASE_URL: sqlite:///./.tmp/ci-migration.db
        run: |
          mkdir -p .tmp
          uv run alembic -c libs/db/alembic.ini upgrade head
          uv run alembic -c libs/db/alembic.ini downgrade base
          uv run alembic -c libs/db/alembic.ini upgrade head

  web:
    name: Web (lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run web:lint
      - name: Type check
        run: npm run web:typecheck

  smoke:
    name: Smoke (Playwright)
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync Python workspace
        run: uv sync --locked --all-packages
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run web:test:smoke
